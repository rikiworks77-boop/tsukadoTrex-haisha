<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塚戸Tレックス・配車調整システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Realtime Database SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAslbHA8YqDEsbWMhJPWD4Yf_38YA19Ies",
            authDomain: "tsukado-trex.firebaseapp.com",
            databaseURL: "https://tsukado-trex-default-rtdb.firebaseio.com",
            projectId: "tsukado-trex",
            storageBucket: "tsukado-trex.firebasestorage.app",
            messagingSenderId: "1069985586158",
            appId: "1:1069985586158:web:2fb0af26767d7ae3214cff",
            measurementId: "G-1S03DVF1KM"
        };

        const defaultData = {
            currentTeam: 'A',
            currentTrip: 'to',
            memberRoleTab: 'player', // player, parent, staff
            memberSubTab: 'all',     // all または 各学年/属性/役割
            teams: {
                A: {
                    currentScheduleId: 'sched_1',
                    masterCars: [
                        { id: 'mcar_1', owner: '鈴木パパ', capacity: 7 },
                        { id: 'mcar_2', owner: '田中ママ', capacity: 5 }
                    ],
                    members: [
                        { id: 'mem_1', name: '田中大輝', role: 'player', grade: '6', subCategory: '6', duty: '-', attendance: 'absent' },
                        { id: 'mem_2', name: '佐藤尚輝', role: 'player', grade: '5', subCategory: '5', duty: '-', attendance: 'absent' },
                        { id: 'mem_3', name: '鈴木パパ', role: 'parent', grade: '-', subCategory: '父', duty: '当番', attendance: 'absent' },
                        { id: 'mem_4', name: '渡辺薫', role: 'staff', grade: '-', subCategory: '-', duty: '-', attendance: 'absent' }
                    ],
                    schedules: [
                        {
                            id: 'sched_1',
                            date: '2026-06-12',
                            destination: '〇〇小学校遠征',
                            activeCarIds: ['mcar_1', 'mcar_2'],
                            gearCarIds: ['mcar_2'],
                            tripTo: { cars: [] },
                            tripFrom: { cars: [] }
                        }
                    ]
                },
                B: { currentScheduleId: 'sched_b1', masterCars: [], members: [], schedules: [{ id: 'sched_b1', date: '2026-06-12', destination: '練習試合', activeCarIds: [], gearCarIds: [], tripTo: { cars: [] }, tripFrom: { cars: [] } }] },
                C: { currentScheduleId: 'sched_c1', masterCars: [], members: [], schedules: [{ id: 'sched_c1', date: '2026-06-12', destination: '練習試合', activeCarIds: [], gearCarIds: [], tripTo: { cars: [] }, tripFrom: { cars: [] } }] },
                D: { currentScheduleId: 'sched_d1', masterCars: [], members: [], schedules: [{ id: 'sched_d1', date: '2026-06-12', destination: '練習試合', activeCarIds: [], gearCarIds: [], tripTo: { cars: [] }, tripFrom: { cars: [] } }] }
            }
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'tsukado_trex/car_manager_data');

        window.appData = JSON.parse(JSON.stringify(defaultData));
        let isLocalChange = false;

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (!isLocalChange) {
                    window.appData = data;
                    if(!window.appData.memberRoleTab) window.appData.memberRoleTab = 'player';
                    if(!window.appData.memberSubTab) window.appData.memberSubTab = 'all';
                    
                    Object.values(window.appData.teams).forEach(team => {
                        if(!team.masterCars) team.masterCars = [];
                        if(!team.schedules) team.schedules = [];
                        
                        team.schedules.forEach(sched => {
                            if(!sched.activeCarIds) {
                                sched.activeCarIds = team.masterCars.map(mc => mc.id);
                            }
                            if(!sched.gearCarIds) {
                                sched.gearCarIds = [];
                            }
                        });

                        if(team.members) {
                            team.members.forEach((m, idx) => {
                                if(!m.id) m.id = 'mem_' + Date.now() + '_' + idx;
                                if(!m.attendance) m.attendance = 'absent';
                                if(!m.role) m.role = 'player';
                                if(!m.grade) m.grade = m.role === 'player' ? '5' : '-';
                                if(!m.subCategory) {
                                    if(m.role === 'player') m.subCategory = m.grade;
                                    else if(m.role === 'parent') m.subCategory = '母';
                                    else m.subCategory = '-';
                                }
                                if(!m.duty) m.duty = '-';
                            });
                        }
                    });

                    document.getElementById('sync-status').textContent = '🟢 リアルタイム同期中';
                    if (typeof window.render === 'function') window.render();
                }
                isLocalChange = false;
            } else {
                set(dbRef, defaultData);
            }
        }, (error) => {
            console.error(error);
            document.getElementById('sync-status').textContent = '⚠️ 同期エラー';
        });

        window.triggerUpdate = async function() {
            isLocalChange = true;
            document.getElementById('sync-status').textContent = '💾 保存中...';
            try {
                await set(dbRef, window.appData);
                document.getElementById('sync-status').textContent = '🟢 リアルタイム同期中';
            } catch (e) {
                console.error(e);
                document.getElementById('sync-status').textContent = '⚠️ 保存失敗';
                isLocalChange = false;
            }
            if (typeof window.render === 'function') window.render();
        };
    </script>
    <style>
        .drag-over { background-color: #eff6ff !important; border-color: #3b82f6 !important; transform: scale(1.02); }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased">
    <div class="max-w-7xl mx-auto p-3 sm:p-6">
        <header class="bg-blue-900 text-white p-4 sm:p-6 rounded-2xl shadow-lg mb-4 sm:mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3 sm:gap-4 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-3">
                    <div class="relative group cursor-pointer w-14 h-14 sm:w-16 sm:h-16 bg-white/10 rounded-xl overflow-hidden flex items-center justify-center border-2 border-white/20 shadow-inner flex-shrink-0">
                        <img id="logo-img" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/..." alt="T-Rex Logo" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-xs font-bold text-center p-1">変更</div>
                        <input type="file" id="logo-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-3xl font-extrabold tracking-wider flex items-center gap-2">
                            塚戸Tレックス <span class="text-blue-400 text-sm sm:text-xl font-medium">配車調整</span>
                        </h1>
                        <p id="sync-status" class="text-xs text-amber-300 mt-1">🔄 接続中...</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-1 w-full md:w-auto bg-blue-950/80 p-1.5 rounded-xl border border-blue-800" id="team-tabs">
                <button type="button" onclick="window.switchTeam('A')" class="team-tab px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition bg-blue-600 text-white shadow text-center" data-team="A">Aチーム</button>
                <button type="button" onclick="window.switchTeam('B')" class="team-tab px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition text-blue-200 hover:text-white text-center" data-team="B">Bチーム</button>
                <button type="button" onclick="window.switchTeam('C')" class="team-tab px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition text-blue-200 hover:text-white text-center" data-team="C">Cチーム</button>
                <button type="button" onclick="window.switchTeam('D')" class="team-tab px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition text-blue-200 hover:text-white text-center" data-team="D">Dチーム</button>
            </div>
        </header>

        <div class="bg-white p-3 sm:p-4 rounded-2xl shadow-md mb-4 sm:mb-6 border border-slate-200">
            <div class="flex flex-col md:flex-row items-center justify-between gap-3 mb-3 pb-3 border-b border-slate-100">
                <div class="flex items-center gap-2 w-full overflow-x-auto py-1" id="schedule-tabs-container"></div>
                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <button type="button" onclick="window.openScheduleModal()" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow flex items-center justify-center gap-1.5 whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        新しい日程を追加
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">試合日:</label>
                    <input type="date" id="current-schedule-date" onchange="window.updateCurrentScheduleDate(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex items-center gap-2 sm:col-span-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">行き先:</label>
                    <input type="text" id="current-schedule-desc" oninput="window.updateCurrentScheduleDesc(this.value)" placeholder="例: 〇〇小学校 / vs 〇〇ファイターズ" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- 今回の日程の出動車両 ＆ 道具車設定エリア -->
            <div class="mt-3 pt-3 border-t border-slate-100 flex flex-col gap-2">
                <div class="text-xs font-bold text-slate-600 flex items-center gap-2">
                    <span>🚗 この日の出動車両（チェックで出動、⭐️で道具車指定）:</span>
                </div>
                <div id="active-cars-selector" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-between pt-3 mt-3 border-t border-slate-100 gap-3">
                <div class="inline-flex w-full sm:w-auto bg-slate-100 p-1 rounded-xl shadow-inner">
                    <button type="button" onclick="window.switchTripType('to')" id="trip-to-btn" class="flex-1 sm:flex-initial px-4 sm:px-6 py-2 rounded-lg text-xs sm:text-sm font-extrabold transition bg-blue-600 text-white shadow">行き（往路）</button>
                    <button type="button" onclick="window.switchTripType('from')" id="trip-from-btn" class="flex-1 sm:flex-initial px-4 sm:px-6 py-2 rounded-lg text-xs sm:text-sm font-extrabold transition text-slate-600 hover:text-slate-900">帰り（復路）</button>
                </div>
                <button type="button" onclick="window.copyToTripFrom()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow flex items-center justify-center gap-1.5">
                    <span>📋 往路の配車を復路にそのままコピーする</span>
                </button>
            </div>
        </div>

        <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-3 sm:p-4 rounded-2xl shadow-lg mb-4 sm:mb-6 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center justify-around w-full sm:w-auto gap-3 sm:gap-6">
                <div>
                    <span id="stat-target-label" class="text-[10px] sm:text-xs text-blue-300 block font-bold">乗車対象(往路)</span>
                    <span id="stat-total" class="text-xl sm:text-2xl font-black">0名</span>
                </div>
                <div class="h-8 w-px bg-blue-700"></div>
                <div>
                    <span class="text-[10px] sm:text-xs text-blue-300 block font-bold">乗車完了</span>
                    <span id="stat-assigned" class="text-xl sm:text-2xl font-black text-emerald-400">0名</span>
                </div>
                <div class="h-8 w-px bg-blue-700"></div>
                <!-- 未割当部分をクリック可能にして誰かすぐわかるように改善 -->
                <div onclick="window.openUnassignedModal()" class="cursor-pointer group hover:bg-white/10 px-2 py-1 rounded-xl transition" title="クリックして未割当メンバーを確認">
                    <span class="text-[10px] sm:text-xs text-amber-300 block font-bold flex items-center gap-1">
                        未割り当て <span class="text-[9px] underline">🔍確認</span>
                    </span>
                    <span id="stat-unassigned" class="text-xl sm:text-2xl font-black text-amber-400 group-hover:scale-105 transition block">0名</span>
                </div>
            </div>
            <div class="flex items-center justify-between w-full sm:w-auto gap-4 bg-blue-950/60 px-3.5 py-2 rounded-xl border border-blue-800">
                <div>
                    <span class="text-[10px] sm:text-xs text-blue-300 block font-bold">総定員 (実効)</span>
                    <span id="stat-seats" class="text-lg sm:text-xl font-bold">0席</span>
                </div>
                <div class="h-8 w-px bg-blue-700"></div>
                <div>
                    <span id="stat-balance-label" class="text-[10px] sm:text-xs font-bold block">過不足</span>
                    <span id="stat-balance" class="text-lg sm:text-xl font-black">余裕 ±0</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-6">
            <!-- チームメンバー管理パネル -->
            <div class="lg:col-span-1 bg-white p-4 sm:p-5 rounded-2xl shadow-md border border-slate-200 flex flex-col h-auto lg:h-[820px]">
                <h2 class="text-base sm:text-lg font-black text-blue-900 mb-3 flex items-center justify-between">
                    <span>チームメンバー</span>
                    <span id="member-count-badge" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full">0名</span>
                </h2>
                
                <!-- 新規メンバー登録フォーム -->
                <form onsubmit="window.addMember(event)" class="space-y-2 mb-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div class="text-xs font-bold text-slate-600">新規メンバー登録</div>
                    <input type="text" id="new-member-name" required placeholder="氏名を入力..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <div class="grid grid-cols-2 gap-1.5">
                        <select id="new-member-role" onchange="window.toggleNewMemberRoleOptions(this.value)" class="bg-white border border-slate-300 rounded-lg px-1.5 py-1.5 text-xs font-bold text-slate-700 outline-none">
                            <option value="player">選手</option>
                            <option value="parent">保護者</option>
                            <option value="staff">スタッフ</option>
                        </select>
                        <select id="new-member-sub" class="bg-white border border-slate-300 rounded-lg px-1.5 py-1.5 text-xs font-bold text-slate-700 outline-none">
                            <option value="6">6年</option>
                            <option value="5" selected>5年</option>
                            <option value="4">4年</option>
                            <option value="3">3年</option>
                            <option value="2">2年</option>
                            <option value="1">1年</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs transition shadow">メンバーを追加</button>
                </form>

                <!-- 役割タブ（選手・保護者・スタッフ） -->
                <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl mb-2 text-xs font-bold text-center">
                    <button type="button" onclick="window.switchMemberRoleTab('player')" id="role-tab-player" class="py-2 rounded-lg transition bg-blue-600 text-white shadow">選手</button>
                    <button type="button" onclick="window.switchMemberRoleTab('parent')" id="role-tab-parent" class="py-2 rounded-lg transition text-slate-600 hover:text-slate-900">保護者</button>
                    <button type="button" onclick="window.switchMemberRoleTab('staff')" id="role-tab-staff" class="py-2 rounded-lg transition text-slate-600 hover:text-slate-900">スタッフ</button>
                </div>

                <!-- サブタブ -->
                <div id="sub-tabs-container" class="mb-3"></div>

                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex justify-between items-center">
                    <span id="unassigned-title">一覧・未割り当て</span>
                    <span class="text-[10px] text-blue-500">ドラッグ / タップで配車</span>
                </div>
                <div id="unassigned-list" class="flex-1 overflow-y-auto space-y-2 pr-1 border border-dashed border-slate-200 rounded-xl p-2.5 sm:p-3 bg-slate-50/50 max-h-[400px] lg:max-h-none" ondragover="window.allowDrop(event)" ondragleave="window.removeDragOver(event)" ondrop="window.dropToUnassigned(event)"></div>
            </div>

            <!-- 車両一覧メインエリア -->
            <div class="lg:col-span-3 flex flex-col gap-4 sm:gap-6">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-white p-4 rounded-2xl shadow-md border border-slate-200 gap-3">
                    <h2 class="text-base sm:text-lg font-black text-blue-900 flex items-center gap-2">
                        <span>出動車両一覧</span>
                        <span id="car-count-badge" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full">0台</span>
                    </h2>
                    <button type="button" onclick="window.openCarModal()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition shadow-md flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        マスター車両を登録・管理
                    </button>
                </div>

                <div id="car-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <!-- 未割当メンバー確認・クイック割当モーダル -->
    <div id="unassigned-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <h3 class="text-lg font-black text-blue-900 flex items-center gap-2">
                    <span>⚠️ 未割り当てメンバー一覧</span>
                </h3>
                <span id="modal-unassigned-count" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold">0名</span>
            </div>
            <p class="text-xs text-slate-500 mb-3">現在車が決まっていない乗車対象メンバーです。（タップして車に割当可能）</p>
            
            <div id="modal-unassigned-list" class="flex-1 overflow-y-auto space-y-2 pr-1 mb-4"></div>

            <div class="flex justify-end pt-2 border-t border-slate-100">
                <button type="button" onclick="window.closeUnassignedModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-bold transition w-full">閉じる</button>
            </div>
        </div>
    </div>

    <!-- メンバー編集モーダル -->
    <div id="edit-member-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 transform transition-all">
            <h3 class="text-xl font-black text-blue-900 mb-4">メンバー情報の編集</h3>
            <form onsubmit="window.handleUpdateMember(event)" class="space-y-4">
                <input type="hidden" id="edit-member-id">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">氏名</label>
                    <input type="text" id="edit-member-name" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">役割</label>
                    <select id="edit-member-role" onchange="window.toggleEditMemberRoleOptions(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none">
                        <option value="player">選手</option>
                        <option value="parent">保護者</option>
                        <option value="staff">スタッフ</option>
                    </select>
                </div>
                <div id="edit-sub-container">
                    <label id="edit-sub-label" class="block text-xs font-bold text-slate-600 mb-1">学年</label>
                    <select id="edit-member-sub" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none">
                        <option value="6">6年</option>
                        <option value="5">5年</option>
                        <option value="4">4年</option>
                        <option value="3">3年</option>
                        <option value="2">2年</option>
                        <option value="1">1年</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="window.closeEditMemberModal()" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">キャンセル</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition shadow">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 車両登録・管理モーダル -->
    <div id="car-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 transform transition-all flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-black text-blue-900 mb-4">マスター車両の登録・削除</h3>

                        <option value="5" selected>5人乗り</option>

            <div class="text-xs font-bold text-slate-500 mb-2">登録済みマスター車両一覧（削除可能）</div>
            <div id="master-car-list" class="flex-1 overflow-y-auto space-y-2 pr-1 mb-4 border border-slate-200 rounded-xl p-2 bg-slate-50"></div>

            <div class="flex justify-end pt-2 border-t border-slate-100">
                <button type="button" onclick="window.closeCarModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-bold transition">閉じる</button>

    <!-- 新規日程追加モーダル -->
    <div id="schedule-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all">
            <h3 class="text-xl font-black text-blue-900 mb-4">新しい日程（試合日）の追加</h3>
            <form onsubmit="window.handleCreateSchedule(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">試合日</label>
                    <input type="date" id="new-sched-date" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">行先・大会名</label>
                    <input type="text" id="new-sched-desc" required placeholder="例: 〇〇小学校遠征" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="window.closeScheduleModal()" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">キャンセル</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold transition shadow">追加する</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const savedLogo = localStorage.getItem('tsukado_trex_logo');
        if(savedLogo) {
            document.getElementById('logo-img').src = savedLogo;
        }

        document.getElementById('logo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64 = event.target.result;
                    document.getElementById('logo-img').src = base64;
                    localStorage.setItem('tsukado_trex_logo', base64);
                }
                reader.readAsDataURL(file);
            }
        });

        window.switchTeam = function(teamKey) {
            if (!window.appData.teams[teamKey]) return;
            window.appData.currentTeam = teamKey;
            window.appData.memberSubTab = 'all';
            window.triggerUpdate();
            document.querySelectorAll('.team-tab').forEach(btn => {
                if(btn.dataset.team === teamKey) {
                    btn.className = "team-tab px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition bg-blue-600 text-white shadow text-center";
                } else {
                    btn.className = "team-tab px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition text-blue-200 hover:text-white text-center";
                }
            });
        };

        window.switchMemberRoleTab = function(role) {
            window.appData.memberRoleTab = role;
            window.appData.memberSubTab = 'all';
            ['player', 'parent', 'staff'].forEach(r => {
                const btn = document.getElementById(`role-tab-${r}`);
                if(btn) {
                    if(r === role) {
                        btn.className = "py-2 rounded-lg transition bg-blue-600 text-white shadow";
                    } else {
                        btn.className = "py-2 rounded-lg transition text-slate-600 hover:text-slate-900";
                    }
                }
            });
            window.render();
        };

        window.switchMemberSubTab = function(sub) {
            window.appData.memberSubTab = sub;
            window.render();
        };

        window.openUnassignedModal = function() {
            renderUnassignedModalList();
            const modal = document.getElementById('unassigned-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeUnassignedModal = function() {
            const modal = document.getElementById('unassigned-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        function renderUnassignedModalList() {
            const container = document.getElementById('modal-unassigned-list');
            const countBadge = document.getElementById('modal-unassigned-count');
            if(!container) return;
            container.innerHTML = '';

            const team = window.appData.teams[window.appData.currentTeam];
            const tripData = getCurrentTripData();
            if(!team || !team.members) return;

            const unassignedMembers = team.members.filter(m => {
                if(m.attendance === 'absent' || m.attendance === 'self') return false;
                const isTarget = window.appData.currentTrip === 'to' ? (m.attendance === 'all' || m.attendance === 'am') : (m.attendance === 'all' || m.attendance === 'pm');
                if(!isTarget) return false;

                let assigned = false;
                if(tripData && tripData.cars) {
                    tripData.cars.forEach(car => {
                        if(car.passengers && car.passengers.includes(m.name)) assigned = true;
                    });
                }
                return !assigned;
            });

            if(countBadge) countBadge.textContent = unassignedMembers.length + '名';

            if(unassignedMembers.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 text-center py-6 font-bold">🎉 未割り当てのメンバーはいません！全員配車完了です。</div>';
                return;
            }

            unassignedMembers.forEach(m => {
                let roleName = '選手';
                if(m.role === 'parent') roleName = '保護者';
                if(m.role === 'staff') roleName = 'スタッフ';

                let subInfo = m.role === 'player' ? `${m.grade}年` : (m.subCategory || '');
                if(m.duty && m.duty !== '-') subInfo += ` (${m.duty})`;

                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-amber-50/70 border border-amber-300 rounded-xl px-3.5 py-2.5 shadow-sm";
                item.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-slate-900 text-sm">${m.name}</span>
                            <span class="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">${roleName}</span>
                            <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-bold">${subInfo}</span>
                        </div>
                    </div>
                    <button type="button" onclick="window.quickAssignPrompt('${m.name}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition shadow">車に割り当てる ➔</button>
                `;
                container.appendChild(item);
            });
        }

        window.quickAssignPrompt = function(memberName) {
            const tripData = getCurrentTripData();
            if(!tripData || !tripData.cars || tripData.cars.length === 0) {
                alert('出動している車両がありません。上のチェックボックスから車を選んでください。');
                return;
            }

            let message = `「${memberName}」をどの車に乗せますか？\n空いている車の番号を選んでください：\n\n`;
            let availableSeats = [];

            tripData.cars.forEach((car, carIdx) => {
                if(!car.passengers) car.passengers = new Array(car.capacity).fill(null);
                const gearStart = car.capacity - 3;
                car.passengers.forEach((p, seatIdx) => {
                    const isGearSeat = car.isGear && seatIdx >= gearStart;
                    if(!p && !isGearSeat) {
                        availableSeats.push({ carId: car.id, seatIndex: seatIdx, text: `${car.owner}号 (席${seatIdx+1})` });
                    }
                });
            });

            if(availableSeats.length === 0) {
                alert('現在、すべての車の空きがありません。');
                return;
            }

            let seatListStr = availableSeats.map((s, i) => `${i + 1}: ${s.text}`).join('\n');
            let selectedNum = prompt(message + seatListStr + '\n\n番号（1〜）を入力してください：');
            
            if(!selectedNum) return;
            let index = parseInt(selectedNum) - 1;
            if(isNaN(index) || index < 0 || index >= availableSeats.length) {
                alert('無効な番号です。');
                return;
            }

            const target = availableSeats[index];
            window.assignMemberToSeat(target.carId, target.seatIndex, memberName);
            renderUnassignedModalList();
        };

        window.toggleNewMemberRoleOptions = function(role) {
            const subSelect = document.getElementById('new-member-sub');
            subSelect.innerHTML = '';
            if(role === 'player') {
                ['6', '5', '4', '3', '2', '1'].forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g + '年';
                    if(g === '5') opt.selected = true;
                    subSelect.appendChild(opt);
                });
            } else if(role === 'parent') {
                ['母', '父', '兄弟'].forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = p;
                    if(p === '母') opt.selected = true;
                    subSelect.appendChild(opt);
                });
            } else {
                const opt = document.createElement('option');
                opt.value = '-';
                opt.textContent = '-';
                subSelect.appendChild(opt);
            }
        };

        window.toggleEditMemberRoleOptions = function(role) {
            const subLabel = document.getElementById('edit-sub-label');
            const subSelect = document.getElementById('edit-member-sub');
            subSelect.innerHTML = '';
            if(role === 'player') {
                subLabel.textContent = '学年';
                ['6', '5', '4', '3', '2', '1'].forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g + '年';
                    subSelect.appendChild(opt);
                });
            } else if(role === 'parent') {
                subLabel.textContent = '保護者区分';
                ['母', '父', '兄弟'].forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = p;
                    subSelect.appendChild(opt);
                });
            } else {
                subLabel.textContent = '属性';
                const opt = document.createElement('option');
                opt.value = '-';
                opt.textContent = '-';
                subSelect.appendChild(opt);
            }
        };

        window.openEditMemberModal = function(memberId) {
            const team = window.appData.teams[window.appData.currentTeam];
            if(!team || !team.members) return;
            const member = team.members.find(m => m.id === memberId);
            if(!member) return;

            document.getElementById('edit-member-id').value = member.id;
            document.getElementById('edit-member-name').value = member.name;
            document.getElementById('edit-member-role').value = member.role;
            window.toggleEditMemberRoleOptions(member.role);
            
            document.getElementById('edit-member-sub').value = member.role === 'player' ? (member.grade || '5') : (member.subCategory || '母');

            const modal = document.getElementById('edit-member-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeEditMemberModal = function() {
            const modal = document.getElementById('edit-member-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.handleUpdateMember = function(event) {
            event.preventDefault();
            const id = document.getElementById('edit-member-id').value;
            const newName = document.getElementById('edit-member-name').value.trim();
            const newRole = document.getElementById('edit-member-role').value;
            const newVal = document.getElementById('edit-member-sub').value;

            if(!newName) return;

            const team = window.appData.teams[window.appData.currentTeam];
            if(!team || !team.members) return;

            if(team.members.some(m => m.id !== id && m.name === newName)) {
                alert('既に同じ名前のメンバーが存在します');
                return;
            }

            const member = team.members.find(m => m.id === id);
            if(member) {
                const oldName = member.name;
                member.name = newName;
                member.role = newRole;
                if(newRole === 'player') {
                    member.grade = newVal;
                    member.subCategory = newVal;
                } else if(newRole === 'parent') {
                    member.grade = '-';
                    member.subCategory = newVal;
                } else {
                    member.grade = '-';
                    member.subCategory = '-';
                }

                if(oldName !== newName && team.schedules) {
                    team.schedules.forEach(sched => {
                        [sched.tripTo, sched.tripFrom].forEach(trip => {
                            if(trip && trip.cars) {
                                trip.cars.forEach(car => {
                                    if(car.passengers) {
                                        car.passengers = car.passengers.map(p => p === oldName ? newName : p);
                                    }
                                });
                            }
                        });
                    });
                }
            }

            window.closeEditMemberModal();
            window.triggerUpdate();
        };

        window.switchTripType = function(type) {
            window.appData.currentTrip = type;
            window.triggerUpdate();
            const toBtn = document.getElementById('trip-to-btn');
            const fromBtn = document.getElementById('trip-from-btn');
            if(type === 'to') {
                toBtn.className = "flex-1 sm:flex-initial px-4 sm:px-6 py-2 rounded-lg text-xs sm:text-sm font-extrabold transition bg-blue-600 text-white shadow";
                fromBtn.className = "flex-1 sm:flex-initial px-4 sm:px-6 py-2 rounded-lg text-xs sm:text-sm font-extrabold transition text-slate-600 hover:text-slate-900";
            } else {
                fromBtn.className = "flex-1 sm:flex-initial px-4 sm:px-6 py-2 rounded-lg text-xs sm:text-sm font-extrabold transition bg-blue-600 text-white shadow";
                toBtn.className = "flex-1 sm:flex-initial px-4 sm:px-6 py-2 rounded-lg text-xs sm:text-sm font-extrabold transition text-slate-600 hover:text-slate-900";
            }
        };

        window.copyToTripFrom = function() {
            const sched = getCurrentSchedule();
            if(!sched || !sched.tripTo || !sched.tripTo.cars) return;
            if(!confirm('往路（行き）の現在の配車メンバーを、復路（帰り）にそのままコピーしますか？')) return;

            if(!sched.tripFrom) sched.tripFrom = { cars: [] };
            
            sched.tripFrom.cars = JSON.parse(JSON.stringify(sched.tripTo.cars));
            sched.tripFrom.cars.forEach(car => {
                car.id = car.masterId + '_from_' + Date.now() + Math.random().toString(36).substr(2, 3);
            });

            window.triggerUpdate();
            alert('往路の配車内容を復路にコピーしました！');
        };

        function getCurrentSchedule() {
            if (!window.appData) return null;
            const team = window.appData.teams[window.appData.currentTeam];
            if (!team) return null;
            if (!team.masterCars) team.masterCars = [];

            if (!team.schedules || team.schedules.length === 0) {
                team.schedules = [{
                    id: 'sched_' + Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    destination: '試合',
                    activeCarIds: team.masterCars.map(mc => mc.id),
                    gearCarIds: [],
                    tripTo: { cars: [] },
                    tripFrom: { cars: [] }
                }];
                team.currentScheduleId = team.schedules[0].id;
            }
            let sched = team.schedules.find(s => s.id === team.currentScheduleId);
            if(!sched) {
                team.currentScheduleId = team.schedules[0].id;
                sched = team.schedules[0];
            }
            if(!sched.activeCarIds) {
                sched.activeCarIds = team.masterCars.map(mc => mc.id);
            }
            if(!sched.gearCarIds) {
                sched.gearCarIds = [];
            }
            syncActiveCarsToSchedule(sched, team);
            return sched;
        }

        function syncActiveCarsToSchedule(sched, team) {
            if(!team.masterCars) team.masterCars = [];
            if(!sched.activeCarIds) sched.activeCarIds = team.masterCars.map(mc => mc.id);
            if(!sched.gearCarIds) sched.gearCarIds = [];
            if(!sched.tripTo) sched.tripTo = { cars: [] };
            if(!sched.tripFrom) sched.tripFrom = { cars: [] };

            const activeMasterCars = team.masterCars.filter(mc => sched.activeCarIds.includes(mc.id));

            let newToCars = [];
            activeMasterCars.forEach(mc => {
                const isGear = sched.gearCarIds.includes(mc.id);
                let existing = sched.tripTo.cars.find(c => c.masterId === mc.id);
                if(existing) {
                    existing.owner = mc.owner;
                    existing.capacity = mc.capacity;
                    existing.isGear = isGear;
                    if(!existing.passengers || existing.passengers.length !== mc.capacity) {
                        let newPas = new Array(mc.capacity).fill(null);
                        if(existing.passengers) {
                            for(let i=0; i<Math.min(existing.passengers.length, mc.capacity); i++) newPas[i] = existing.passengers[i];
                        }
                        existing.passengers = newPas;
                    }
                    if (isGear) {
                        const gearStart = mc.capacity - 3;
                        for (let i = gearStart; i < mc.capacity; i++) {
                            existing.passengers[i] = null;
                        }
                    }
                    newToCars.push(existing);
                } else {
                    newToCars.push({
                        id: mc.id + '_to_' + Date.now() + Math.random().toString(36).substr(2, 3),
                        masterId: mc.id,
                        owner: mc.owner,
                        capacity: mc.capacity,
                        isGear: isGear,
                        passengers: new Array(mc.capacity).fill(null)
                    });
                }
            });
            sched.tripTo.cars = newToCars;

            let newFromCars = [];
            activeMasterCars.forEach(mc => {
                const isGear = sched.gearCarIds.includes(mc.id);
                let existing = sched.tripFrom.cars.find(c => c.masterId === mc.id);
                if(existing) {
                    existing.owner = mc.owner;
                    existing.capacity = mc.capacity;
                    existing.isGear = isGear;
                    if(!existing.passengers || existing.passengers.length !== mc.capacity) {
                        let newPas = new Array(mc.capacity).fill(null);
                        if(existing.passengers) {
                            for(let i=0; i<Math.min(existing.passengers.length, mc.capacity); i++) newPas[i] = existing.passengers[i];
                        }
                        existing.passengers = newPas;
                    }
                    if (isGear) {
                        const gearStart = mc.capacity - 3;
                        for (let i = gearStart; i < mc.capacity; i++) {
                            existing.passengers[i] = null;
                        }
                    }
                    newFromCars.push(existing);
                } else {
                    newFromCars.push({
                        id: mc.id + '_from_' + Date.now() + Math.random().toString(36).substr(2, 3),
                        masterId: mc.id,
                        owner: mc.owner,
                        capacity: mc.capacity,
                        isGear: isGear,
                        passengers: new Array(mc.capacity).fill(null)
                    });
                }
            });
            sched.tripFrom.cars = newFromCars;
        }

        window.toggleCarActiveForSchedule = function(masterId) {
            const sched = getCurrentSchedule();
            if(!sched) return;
            if(!sched.activeCarIds) sched.activeCarIds = [];

            const index = sched.activeCarIds.indexOf(masterId);
            if(index > -1) {
                sched.activeCarIds.splice(index, 1);
                sched.gearCarIds = sched.gearCarIds.filter(id => id !== masterId);

                [sched.tripTo, sched.tripFrom].forEach(trip => {
                    if(trip && trip.cars) {
                        trip.cars.forEach(car => {
                            if(car.masterId === masterId && car.passengers) {
                                car.passengers = new Array(car.capacity).fill(null);
                            }
                        });
                    }
                });
            } else {
                sched.activeCarIds.push(masterId);
            }
            window.triggerUpdate();
        };

        window.toggleCarGearForSchedule = function(masterId) {
            const sched = getCurrentSchedule();
            if(!sched) return;
            if(!sched.gearCarIds) sched.gearCarIds = [];

            const index = sched.gearCarIds.indexOf(masterId);
            if(index > -1) {
                sched.gearCarIds.splice(index, 1);
            } else {
                sched.gearCarIds.push(masterId);
            }
            syncActiveCarsToSchedule(sched, window.appData.teams[window.appData.currentTeam]);
            window.triggerUpdate();
        };

        window.switchSchedule = function(schedId) {
            const team = window.appData.teams[window.appData.currentTeam];
            team.currentScheduleId = schedId;
            window.triggerUpdate();
        };

        window.openScheduleModal = function() {
            const modal = document.getElementById('schedule-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('new-sched-date').value = new Date().toISOString().split('T')[0];
        };

        window.closeScheduleModal = function() {
            const modal = document.getElementById('schedule-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.handleCreateSchedule = function(event) {
            event.preventDefault();
            const dateInput = document.getElementById('new-sched-date').value;
            const descInput = document.getElementById('new-sched-desc').value.trim();
            if(!dateInput || !descInput) return;

            const team = window.appData.teams[window.appData.currentTeam];
            if (!team.masterCars) team.masterCars = [];
            if (!team.schedules) team.schedules = [];
            const newId = 'sched_' + Date.now();
            
            const newSched = {
                id: newId,
                date: dateInput,
                destination: descInput,
                activeCarIds: team.masterCars.map(mc => mc.id),
                gearCarIds: [],
                tripTo: { cars: [] },
                tripFrom: { cars: [] }
            };
            syncActiveCarsToSchedule(newSched, team);

            team.schedules.push(newSched);
            team.currentScheduleId = newId;
            document.getElementById('new-sched-desc').value = '';
            window.closeScheduleModal();
            window.triggerUpdate();
        };

        window.updateCurrentScheduleDate = function(val) {
            const sched = getCurrentSchedule();
            if(sched) {
                sched.date = val;
                window.triggerUpdate();
            }
        };

        window.updateCurrentScheduleDesc = function(val) {
            const sched = getCurrentSchedule();
            if(sched) {
                sched.destination = val;
                window.triggerUpdate();
            }
        };

        function getTargetMembers() {
            const team = window.appData.teams[window.appData.currentTeam];
            if (!team || !team.members) return [];
            return team.members.filter(m => {
                if(m.attendance === 'absent' || m.attendance === 'self') return false; 
                if(window.appData.currentTrip === 'to') {
                    return m.attendance === 'all' || m.attendance === 'am';
                } else {
                    return m.attendance === 'all' || m.attendance === 'pm';
                }
            });
        }

        function getCurrentTripData() {
            const sched = getCurrentSchedule();
            if(!sched) return { cars: [] };
            if(!sched.tripTo) sched.tripTo = { cars: [] };
            if(!sched.tripFrom) sched.tripFrom = { cars: [] };
            return window.appData.currentTrip === 'to' ? sched.tripTo : sched.tripFrom;
        }

        window.addMember = function(event) {
            event.preventDefault();
            const input = document.getElementById('new-member-name');
            const roleSelect = document.getElementById('new-member-role');
            const subSelect = document.getElementById('new-member-sub');
            
            const name = input.value.trim();
            if(!name) return;
            
            const team = window.appData.teams[window.appData.currentTeam];
            if(!team.members) team.members = [];
            if(team.members.some(m => m.name === name)) {
                alert('既に登録されている名前です');
                return;
            }

            const role = roleSelect.value;
            const subVal = subSelect.value;

            team.members.push({ 
                id: 'mem_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                name: name, 
                role: role, 
                grade: role === 'player' ? subVal : '-',
                subCategory: role === 'parent' ? subVal : '-',
                duty: '-',
                attendance: 'absent'
            });
            input.value = '';
            window.triggerUpdate();
        };

        window.removeMember = function(name) {
            if(!confirm(`「${name}」を削除しますか？`)) return;
            const team = window.appData.teams[window.appData.currentTeam];
            if(!team || !team.members) return;
            team.members = team.members.filter(m => m.name !== name);
            if(team.schedules) {
                team.schedules.forEach(sched => {
                    [sched.tripTo, sched.tripFrom].forEach(trip => {
                        if(trip && trip.cars) {
                            trip.cars.forEach(car => {
                                if(car.passengers) {
                                    car.passengers = car.passengers.map(p => p === name ? null : p);
                                }
                            });
                        }
                    });
                });
            }
            window.triggerUpdate();
        };

        window.updateMemberProp = function(name, prop, val) {
            const team = window.appData.teams[window.appData.currentTeam];
            if(!team || !team.members) return;
            const member = team.members.find(m => m.name === name);
            if(member) {
                member[prop] = val;
                if(prop === 'attendance' && (val === 'absent' || val === 'self')) {
                    if(team.schedules) {
                        team.schedules.forEach(sched => {
                            [sched.tripTo, sched.tripFrom].forEach(trip => {
                                if(trip && trip.cars) {
                                    trip.cars.forEach(car => {
                                        if(car.passengers) {
                                            car.passengers = car.passengers.map(p => p === name ? null : p);
                                        }
                                    });
                                }
                            });
                        });
                    }
                }
                window.triggerUpdate();
            }
        };

        window.openCarModal = function() {
            const modal = document.getElementById('car-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            renderMasterCarList();
        };

        window.closeCarModal = function() {
            const modal = document.getElementById('car-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.handleCreateMasterCar = function(event) {
            event.preventDefault();
            const owner = document.getElementById('master-car-owner').value.trim();
            const capacity = parseInt(document.getElementById('master-car-capacity').value);

            if(!owner) return;

            const team = window.appData.teams[window.appData.currentTeam];
            if(!team.masterCars) team.masterCars = [];

            const masterId = 'mcar_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            team.masterCars.push({
                id: masterId,
                owner: owner,
                capacity: capacity
            });

            if(team.schedules) {
                team.schedules.forEach(sched => {
                    if(!sched.activeCarIds) sched.activeCarIds = [];
                    sched.activeCarIds.push(masterId);
                    syncActiveCarsToSchedule(sched, team);
                });
            }

            document.getElementById('master-car-owner').value = '';
            renderMasterCarList();
            window.triggerUpdate();
        };

        window.deleteMasterCar = function(masterId) {
            if(!confirm('このマスター車両を完全に削除しますか？')) return;
            const team = window.appData.teams[window.appData.currentTeam];
            if(!team || !team.masterCars) return;

            team.masterCars = team.masterCars.filter(mc => mc.id !== masterId);

            if(team.schedules) {
                team.schedules.forEach(sched => {
                    if(sched.activeCarIds) {
                        sched.activeCarIds = sched.activeCarIds.filter(id => id !== masterId);
                    }
                    if(sched.gearCarIds) {
                        sched.gearCarIds = sched.gearCarIds.filter(id => id !== masterId);
                    }
                    if(sched.tripTo && sched.tripTo.cars) {
                        sched.tripTo.cars = sched.tripTo.cars.filter(c => c.masterId !== masterId);
                    }
                    if(sched.tripFrom && sched.tripFrom.cars) {
                        sched.tripFrom.cars = sched.tripFrom.cars.filter(c => c.masterId !== masterId);
                    }
                });
            }
            renderMasterCarList();
            window.triggerUpdate();
        };

        function renderMasterCarList() {
            const container = document.getElementById('master-car-list');
            if(!container) return;
            container.innerHTML = '';

            const team = window.appData.teams[window.appData.currentTeam];
            if(!team.masterCars || team.masterCars.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">登録されているマスター車両はありません</div>';
                return;
            }

            team.masterCars.forEach(mc => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-white border border-slate-200 rounded-xl px-3 py-2 shadow-sm";
                item.innerHTML = `
                    <div>
                        <span class="font-extrabold text-blue-900 text-sm">${mc.owner}号</span>
                        <span class="text-xs text-slate-500 ml-2">定員: ${mc.capacity}名</span>
                    </div>
                    <button type="button" onclick="window.deleteMasterCar('${mc.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold px-2.5 py-1 rounded-lg text-xs transition">削除</button>
                `;
                container.appendChild(item);
            });
        }

        let draggedMember = null;

        window.dragMember = function(e, name) {
            draggedMember = name;
            e.dataTransfer.setData('text/plain', name);
        };

        window.allowDrop = function(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        };

        window.removeDragOver = function(e) {
            e.currentTarget.classList.remove('drag-over');
        };

        window.dropToSeat = function(e, carId, seatIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const memberName = draggedMember || e.dataTransfer.getData('text/plain');
            if(!memberName) return;

            window.assignMemberToSeat(carId, seatIndex, memberName);
        };

        window.dropToUnassigned = function(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const memberName = draggedMember || e.dataTransfer.getData('text/plain');
            if(!memberName) return;

            window.unassignMember(memberName);
        };

        window.assignMemberToSeat = function(carId, seatIndex, memberName) {
            const tripData = getCurrentTripData();
            if(!tripData || !tripData.cars) return;

            tripData.cars.forEach(c => {
                if(c.passengers) {
                    c.passengers = c.passengers.map(p => p === memberName ? null : p);
                }
            });

            const car = tripData.cars.find(c => c.id === carId);
            if(car) {
                const gearStartIndex = car.capacity - 3;
                if(car.isGear && seatIndex >= gearStartIndex) return;

                if(!car.passengers) car.passengers = new Array(car.capacity).fill(null);
                car.passengers[seatIndex] = memberName;
            }
            draggedMember = null;
            window.triggerUpdate();
        };

        window.unassignMember = function(memberName) {
            const tripData = getCurrentTripData();
            if(!tripData || !tripData.cars) return;
            tripData.cars.forEach(c => {
                if(c.passengers) {
                    c.passengers = c.passengers.map(p => p === memberName ? null : p);
                }
            });
            draggedMember = null;
            window.triggerUpdate();
        };

        function renderScheduleTabs() {
            const team = window.appData.teams[window.appData.currentTeam];
            const container = document.getElementById('schedule-tabs-container');
            if (!container || !team) return;
            container.innerHTML = '';

            if (!team.schedules || team.schedules.length === 0) return;

            team.schedules.forEach(sched => {
                const isActive = sched.id === team.currentScheduleId;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => window.switchSchedule(sched.id);
                btn.className = `px-3.5 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap shadow-sm border ${isActive ? 'bg-blue-600 text-white border-blue-600 shadow' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`;
                btn.textContent = `${sched.date} (${sched.destination || '無題'})`;
                container.appendChild(btn);
            });
        }

        window.render = function() {
            if (!window.appData || !window.appData.teams) return;
            const teamKey = window.appData.currentTeam;
            const team = window.appData.teams[teamKey];
            if (!team) return;
            const sched = getCurrentSchedule();
            
            renderScheduleTabs();

            if(sched) {
                const dateEl = document.getElementById('current-schedule-date');
                const descEl = document.getElementById('current-schedule-desc');
                if(dateEl) dateEl.value = sched.date || '';
                if(descEl) descEl.value = sched.destination || '';

                const activeSelector = document.getElementById('active-cars-selector');
                if(activeSelector) {
                    activeSelector.innerHTML = '';
                    if(!team.masterCars || team.masterCars.length === 0) {
                        activeSelector.innerHTML = '<span class="text-xs text-slate-400">登録車がありません</span>';
                    } else {
                        team.masterCars.forEach(mc => {
                            const isActive = sched.activeCarIds && sched.activeCarIds.includes(mc.id);
                            const isGear = sched.gearCarIds && sched.gearCarIds.includes(mc.id);

                            const wrapper = document.createElement('div');
                            wrapper.className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-bold transition border ${isActive ? 'bg-blue-50 border-blue-400 text-blue-900 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-400'}`;
                            wrapper.innerHTML = `
                                <label class="inline-flex items-center gap-1 cursor-pointer">
                                    <input type="checkbox" ${isActive ? 'checked' : ''} onchange="window.toggleCarActiveForSchedule('${mc.id}')" class="rounded text-blue-600 focus:ring-blue-500 w-3.5 h-3.5">
                                    <span>${mc.owner}号</span>
                                </label>
                                ${isActive ? `
                                <button type="button" onclick="window.toggleCarGearForSchedule('${mc.id}')" title="クリックして道具車に指定/解除" class="ml-1 px-1.5 py-0.5 rounded text-[11px] transition ${isGear ? 'bg-amber-500 text-white shadow' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}">
                                    ${isGear ? '⭐️ 道具車' : '○ 通常'}
                                </button>` : ''}
                            `;
                            activeSelector.appendChild(wrapper);
                        });
                    }
                }
            }

            // サブタブ描画
            const subTabsContainer = document.getElementById('sub-tabs-container');
            if(subTabsContainer) {
                subTabsContainer.innerHTML = '';
                subTabsContainer.className = "mb-3 block";
                const currentRoleTab = window.appData.memberRoleTab || 'player';
                
                if(currentRoleTab === 'player') {
                    let grades = ['6', '5'];
                    if(teamKey === 'B') grades = ['5', '4', '3'];
                    if(teamKey === 'C') grades = ['3', '2', '1'];
                    if(teamKey === 'D') grades = ['6', '5', '4', '3', '2', '1'];

                    const wrapper = document.createElement('div');
                    wrapper.className = `grid grid-cols-${grades.length + 1} gap-1 bg-slate-100 p-1 rounded-xl text-[11px] font-bold text-center`;
                    
                    const allActive = window.appData.memberSubTab === 'all';
                    const allBtn = document.createElement('button');
                    allBtn.type = 'button';
                    allBtn.onclick = () => window.switchMemberSubTab('all');
                    allBtn.className = `py-1.5 rounded-lg transition ${allActive ? 'bg-white text-blue-900 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'}`;
                    allBtn.textContent = '全員';
                    wrapper.appendChild(allBtn);

                    grades.forEach(g => {
                        const isActive = window.appData.memberSubTab === g;
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.onclick = () => window.switchMemberSubTab(g);
                        btn.className = `py-1.5 rounded-lg transition ${isActive ? 'bg-white text-blue-900 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'}`;
                        btn.textContent = `${g}年`;
                        wrapper.appendChild(btn);
                    });
                    subTabsContainer.appendChild(wrapper);

                } else if(currentRoleTab === 'parent') {
                    const parentContainer = document.createElement('div');
                    parentContainer.className = "flex flex-col gap-1.5 bg-slate-100 p-1.5 rounded-xl text-[11px] font-bold";

                    // 第1段：全員・母・父・兄弟
                    const row1 = document.createElement('div');
                    row1.className = "grid grid-cols-4 gap-1 text-center";
                    const subCats = ['all', '母', '父', '兄弟'];
                    const subCatLabels = { 'all': '全員', '母': '母', '父': '父', '兄弟': '兄弟' };
                    subCats.forEach(sc => {
                        const isActive = window.appData.memberSubTab === sc;
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.onclick = () => window.switchMemberSubTab(sc);
                        btn.className = `py-1.5 rounded-lg transition ${isActive ? 'bg-blue-600 text-white shadow-sm font-bold' : 'bg-white text-slate-700 hover:bg-slate-200'}`;
                        btn.textContent = subCatLabels[sc];
                        row1.appendChild(btn);
                    });
                    parentContainer.appendChild(row1);

                    // 第2段：当番・塁審・スコアラー
                    const row2 = document.createElement('div');
                    row2.className = "grid grid-cols-3 gap-1 text-center";
                    const duties = ['当番', '塁審', 'スコアラー'];
                    duties.forEach(d => {
                        const isActive = window.appData.memberSubTab === d;
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.onclick = () => window.switchMemberSubTab(d);
                        btn.className = `py-1.5 rounded-lg transition ${isActive ? 'bg-blue-600 text-white shadow-sm font-bold' : 'bg-white text-slate-700 hover:bg-slate-200'}`;
                        btn.textContent = d;
                        row2.appendChild(btn);
                    });
                    parentContainer.appendChild(row2);

                    subTabsContainer.appendChild(parentContainer);
                } else {
                    subTabsContainer.className = "hidden";
                }
            }

            const tripData = getCurrentTripData();
            const targetMembers = getTargetMembers();
            if(!team.members) team.members = [];

            const memberBadge = document.getElementById('member-count-badge');
            const carBadge = document.getElementById('car-count-badge');
            const statTargetLabel = document.getElementById('stat-target-label');

            if(memberBadge) memberBadge.textContent = team.members.length + '名';
            if(carBadge) carBadge.textContent = (tripData && tripData.cars ? tripData.cars.length : 0) + '台';
            if(statTargetLabel) statTargetLabel.textContent = window.appData.currentTrip === 'to' ? '乗車対象(往路)' : '乗車対象(復路)';

            const unassignedContainer = document.getElementById('unassigned-list');
            if(unassignedContainer) {
                unassignedContainer.innerHTML = '';

                const currentRoleTab = window.appData.memberRoleTab || 'player';
                const currentSubTab = window.appData.memberSubTab || 'all';

                const filteredMembers = team.members.filter(m => {
                    if (m.role !== currentRoleTab) return false;
                    if (currentRoleTab === 'player' && currentSubTab !== 'all' && m.grade !== currentSubTab) return false;
                    if (currentRoleTab === 'parent' && currentSubTab !== 'all') {
                        if (['all', '母', '父', '兄弟'].includes(currentSubTab)) {
                            if (currentSubTab !== 'all' && (m.subCategory || '母') !== currentSubTab) return false;
                        } else {
                            if ((m.duty || '-') !== currentSubTab) return false;
                        }
                    }
                    return true;
                });

                if(filteredMembers.length === 0) {
                    unassignedContainer.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">該当するメンバーがいません</div>';

                    if(currentRoleTab === 'player') {
                        filteredMembers.forEach(m => {
                            let g = m.grade || 'その他';
                            if(!groups[g]) groups[g] = [];
                            groups[g].push(m);

                        filteredMembers.forEach(m => {
                            let sc = m.subCategory || '母';
                            if(!groups[sc]) groups[sc] = [];
                            groups[sc].push(m);
                        });

                        groups['一覧'] = filteredMembers;

                    Object.keys(groups).sort().forEach(groupKey => {

                                    <div class="flex items-center gap-1">

                                        <button type="button" onclick="window.removeMember('${m.name}')" class="text-slate-400 hover:text-red-500 text-xs px-1 py-0.5 rounded" title="削除">✕</button>
