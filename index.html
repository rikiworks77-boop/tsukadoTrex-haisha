<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塚戸Tレックス・配車調整システム</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        .drag-over { background-color: #eff6ff !important; border-color: #3b82f6 !important; transform: scale(1.02); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <div class="max-w-7xl mx-auto p-4 sm:p-6">
        <!-- ヘッダー -->
        <header class="bg-blue-900 text-white p-4 sm:p-6 rounded-2xl shadow-lg mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="relative group cursor-pointer w-16 h-16 bg-white/10 rounded-xl overflow-hidden flex items-center justify-center border-2 border-white/20 shadow-inner">
                    <div class="w-full h-full bg-blue-800 flex items-center justify-center font-bold text-xl">🦖</div>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider flex items-center gap-2">
                        塚戸Tレックス <span class="text-blue-400 text-lg sm:text-xl font-medium">配車調整システム</span>
                    </h1>
                </div>
            </div>

            <!-- チームタブ -->
            <div class="flex bg-blue-950/80 p-1.5 rounded-xl border border-blue-800 gap-1" id="team-tabs">
                <button type="button" onclick="switchTeam('A')" class="team-tab px-4 py-2 rounded-lg text-sm font-bold transition bg-blue-600 text-white shadow" data-team="A">Aチーム</button>
                <button type="button" onclick="switchTeam('B')" class="team-tab px-4 py-2 rounded-lg text-sm font-bold transition text-blue-200 hover:text-white" data-team="B">Bチーム</button>
                <button type="button" onclick="switchTeam('C')" class="team-tab px-4 py-2 rounded-lg text-sm font-bold transition text-blue-200 hover:text-white" data-team="C">Cチーム</button>
                <button type="button" onclick="switchTeam('D')" class="team-tab px-4 py-2 rounded-lg text-sm font-bold transition text-blue-200 hover:text-white" data-team="D">Dチーム</button>
            </div>
        </header>

        <!-- 同期状態ステータス -->
        <div id="sync-status" class="mb-4 text-center text-xs font-bold text-slate-500 bg-white py-1 rounded-full shadow-sm max-w-xs mx-auto border border-slate-200">
            🔄 データを読み込み中...
        </div>

        <!-- 日程切替・詳細設定 -->
        <div class="bg-white p-4 rounded-2xl shadow-md mb-6 border border-slate-200">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">試合日:</label>
                    <input type="date" id="current-schedule-date" onchange="updateDate(this.value)" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex items-center gap-2 md:col-span-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">行き先・対戦相手:</label>
                    <input type="text" id="current-schedule-desc" onchange="updateDesc(this.value)" placeholder="例: 〇〇小学校 / vs 〇〇ファイターズ" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- 左側：メンバー登録と一覧 -->
            <div class="lg:col-span-1 bg-white p-5 rounded-2xl shadow-md border border-slate-200 flex flex-col">
                <h2 class="text-lg font-black text-blue-900 mb-3 flex items-center justify-between">
                    <span>メンバー大元</span>
                    <span id="member-count" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full">0名</span>
                </h2>
                
                <form onsubmit="addMember(event)" class="space-y-2 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div class="text-xs font-bold text-slate-600">新規メンバー登録</div>
                    <input type="text" id="new-member-name" required placeholder="氏名を入力..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold p-1.5 rounded-lg text-xs hover:bg-blue-700 transition">追加</button>
                </form>

                <div id="member-list" class="space-y-1 overflow-y-auto max-h-[400px]">
                    <!-- メンバーが動的に入ります -->
                </div>
            </div>

            <!-- 右側：配車エリア -->
            <div class="lg:col-span-3 bg-white p-5 rounded-2xl shadow-md border border-slate-200">
                <h2 class="text-lg font-black text-blue-900 mb-4">配車割当て</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="car-container">
                    <!-- 各車両のスペース（簡易版） -->
                    <div class="bg-slate-50 p-4 rounded-xl border-2 border-dashed border-slate-300" ondragover="allowDrop(event)" ondrop="drop(event, 'car1')">
                        <div class="font-bold text-slate-700 text-sm mb-2">🚗 車両 1 (定員4名)</div>
                        <div id="car1-list" class="min-h-[80px] space-y-1"></div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border-2 border-dashed border-slate-300" ondragover="allowDrop(event)" ondrop="drop(event, 'car2')">
                        <div class="font-bold text-slate-700 text-sm mb-2">🚗 車両 2 (定員4名)</div>
                        <div id="car2-list" class="min-h-[80px] space-y-1"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🌐 リアルタイム同期用スクリプト -->
    <script>
        // オンライン保存先（テスト用の無料共有スペース）
        const BIN_ID = "65fc7fd8266cfc3fde9b8e21"; // あなた専用の一時データ箱
        const API_URL = `https://jsonbin.io`; 
        const MASTER_KEY = "$2a$10$6R6h7N4X03XyX9RjHqF0I.g8K5G.8gR8O7M6R5E4W3Q2A1S0D9F8G"; // 簡易アクセスキー

        // システム内のデータ状態
        let appData = {
            currentTeam: 'A',
            date: '',
            desc: '',
            members: [],
            assignments: { car1: [], car2: [] }
        };

        // ページを開いたとき：自動で最新データをネットから読み込む
        async function loadData() {
            try {
                const res = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const json = await res.json();
                if (json.record) {
                    appData = json.record;
                    render();
                    document.getElementById('sync-status').innerText = "✅ 全員とリアルタイム同期中";
                }
            } catch (e) {
                document.getElementById('sync-status').innerText = "❌ 読み込み失敗。リロードしてください";
            }
        }

        // 誰かが操作したとき：ネット上のデータを上書きして全員に同期する
        async function saveData() {
            document.getElementById('sync-status').innerText = "⏳ 同期中...";
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(appData)
                });
                document.getElementById('sync-status').innerText = "✅ 全員とリアルタイム同期中";
            } catch (e) {
                document.getElementById('sync-status').innerText = "⚠️ 保存に失敗しました";
            }
        }

        // 画面の再描画処理
        function render() {
            document.getElementById('current-schedule-date').value = appData.date || '';
            document.getElementById('current-schedule-desc').value = appData.desc || '';
            
            // チームタブの見た目
            document.querySelectorAll('.team-tab').forEach(btn => {
                if (btn.getAttribute('data-team') === appData.currentTeam) {
                    btn.className = "team-tab px-4 py-2 rounded-lg text-sm font-bold transition bg-blue-600 text-white shadow";
                } else {
                    btn.className = "team-tab px-4 py-2 rounded-lg text-sm font-bold transition text-blue-200 hover:text-white";
                }
            });

            // メンバー一覧の描画
            const memberList = document.getElementById('member-list');
            memberList.innerHTML = '';
            const filteredMembers = appData.members.filter(m => m.team === appData.currentTeam);
            document.getElementById('member-count').innerText = filteredMembers.length + "名";

            filteredMembers.forEach(m => {
                const div = document.createElement('div');
                div.className = "bg-slate-50 p-2 rounded-lg border border-slate-200 shadow-sm flex justify-between items-center text-xs font-bold cursor-pointer hover:bg-slate-100";
                div.draggable = true;
                div.innerText = m.name;
                div.ondragstart = (e) => e.dataTransfer.setData('text/plain', m.name);
                memberList.appendChild(div);
            });

            // 配車車両の描画
            ['car1', 'car2'].forEach(carId => {
                const carList = document.getElementById(`${carId}-list`);
                carList.innerHTML = '';
                const list = appData.assignments[carId] || [];
                list.forEach(name => {
                    const item = document.createElement('div');
