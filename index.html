                                <div class="flex items-center justify-between text-[11px] pt-1 border-t border-slate-100">
                                    <div class="flex gap-1.5 items-center">
                                        <select onchange="window.updateMemberProp('${m.name}', 'attendance', this.value)" class="bg-slate-50 border border-slate-200 rounded px-1.5 py-1 text-xs font-bold ${m.attendance==='absent'?'text-rose-600':(m.attendance==='self'?'text-amber-600':'text-slate-700')} outline-none">
                                            <option value="absent" ${m.attendance==='absent'?'selected':''}>休み</option>
                                            <option value="all" ${m.attendance==='all'?'selected':''}>終日</option>
                                            <option value="am" ${m.attendance==='am'?'selected':''}>午前</option>
                                            <option value="pm" ${m.attendance==='pm'?'selected':''}>午後</option>
                                            <option value="self" ${m.attendance==='self'?'selected':''}>自車</option>
                                        </select>
                                        ${m.role === 'parent' ? `
                                        <select onchange="window.updateMemberProp('${m.name}', 'duty', this.value)" class="bg-slate-50 border border-slate-200 rounded px-1.5 py-1 text-xs font-bold text-slate-700 outline-none">
                                            <option value="-" ${m.duty==='-'?'selected':''}>役割なし</option>
                                            <option value="当番" ${m.duty==='当番'?'selected':''}>当番</option>
                                            <option value="スコアラー" ${m.duty==='スコアラー'?'selected':''}>スコアラー</option>
                                            <option value="塁審" ${m.duty==='塁審'?'selected':''}>塁審</option>
                                        </select>` : ''}
                                    </div>
                                    <span>${statusText}</span>
                                </div>
                            `;
                            unassignedContainer.appendChild(el);
                        });
                    });
                }
            }

            const carGrid = document.getElementById('car-grid');
            if(carGrid) {
                carGrid.innerHTML = '';

                let totalCapacity = 0;
                let totalAssigned = 0;
                const cars = tripData && tripData.cars ? tripData.cars : [];

                cars.forEach(car => {
                    const effectiveCapacity = car.isGear ? Math.max(0, car.capacity - 3) : car.capacity;
                    totalCapacity += effectiveCapacity;

                    if(!car.passengers) car.passengers = new Array(car.capacity).fill(null);

                    const gearStartIndex = car.capacity - 3;
                    const assignedCount = car.passengers.filter((p, idx) => {
                        if(car.isGear && idx >= gearStartIndex) return false;
                        return p !== null;
                    }).length;
                    totalAssigned += assignedCount;

                    const carCard = document.createElement('div');
                    carCard.className = "bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-md flex flex-col justify-between";
                    
                    let seatsHtml = '';
                    for(let i = 0; i < car.capacity; i++) {
                        const isGearSeat = car.isGear && i >= gearStartIndex;
                        const occupant = car.passengers[i];

                        let seatLabel = `席 ${i+1}`;
                        if(i === 0) seatLabel = '席 1（運転者）';
                        if(i === 1) seatLabel = '席 2（助手席）';

                        if(isGearSeat) {
                            seatsHtml += `
                                <div class="h-14 rounded-xl bg-amber-100 border-2 border-dashed border-amber-300 flex flex-col items-center justify-center text-amber-800 font-bold text-xs select-none shadow-inner">
                                    <span>🎒</span>
                                    <span class="text-[10px]">道具</span>
                                </div>
                            `;
                        } else if(occupant) {
                            seatsHtml += `
                                <div draggable="true" ondragstart="window.dragMember(event, '${occupant}')" 
                                     ondragover="window.allowDrop(event)" ondragleave="window.removeDragOver(event)" ondrop="window.dropToSeat(event, '${car.id}', ${i})"
                                     class="h-14 rounded-xl bg-blue-50 border-2 border-blue-400 flex flex-col items-center justify-center text-blue-900 font-bold text-xs cursor-grab hover:bg-blue-100 transition shadow-sm relative group">
                                    <span class="text-[10px] text-blue-500">${seatLabel}</span>
                                    <span class="truncate px-1 max-w-full">${occupant}</span>
                                    <button type="button" onclick="window.unassignMember('${occupant}')" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center">×</button>
                                </div>
                            `;
                        } else {
                            seatsHtml += `
                                <div onclick="window.selectSeatForQuickAssign('${car.id}', ${i})" ondragover="window.allowDrop(event)" ondragleave="window.removeDragOver(event)" ondrop="window.dropToSeat(event, '${car.id}', ${i})"
                                     class="h-14 rounded-xl bg-slate-50 border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 text-xs hover:border-blue-400 hover:bg-blue-50/30 transition cursor-pointer" title="タップして乗せるメンバーを選ぶ">
                                    <span class="text-[10px]">${seatLabel}</span>
                                    <span class="text-[10px] text-blue-600 font-bold">+ 選択</span>
                                </div>
                            `;
                        }
                    }

                    carCard.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-2">
                                    <span class="text-xl">🚗</span>
                                    <div>
                                        <h3 class="font-extrabold text-blue-900">${car.owner}号</h3>
                                        <p class="text-xs text-slate-500">定員: ${car.capacity}名 ${car.isGear ? '<span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold ml-1">⭐️ 道具車(後ろ3席)</span>' : ''}</p>
                                    </div>
                                </div>
                                <button type="button" onclick="window.toggleCarActiveForSchedule('${car.masterId}')" class="text-slate-400 hover:text-amber-600 text-xs px-2 py-1 rounded-lg hover:bg-amber-50 transition border border-slate-200">この日だけ外す</button>
                            </div>
                            <div class="grid grid-cols-4 gap-2 mb-4">
                                ${seatsHtml}
                            </div>
                        </div>
                        <div class="text-right text-xs font-bold text-slate-500 border-t border-slate-100 pt-2">
                            乗車人数: <span class="text-blue-600 font-black">${assignedCount}</span> / ${effectiveCapacity} 名
                        </div>
                    `;
                    carGrid.appendChild(carCard);
                });

                if(cars.length === 0) {
                    carGrid.innerHTML = `
                        <div class="col-span-2 py-12 text-center bg-white border border-dashed border-slate-300 rounded-2xl">
                            <p class="text-slate-400 text-sm font-bold">この日に出動する車がありません。上部のチェックボックスから選択してください。</p>
                        </div>
                    `;
                }
            }

            const totalTarget = targetMembers.length;
            const unassignedCount = targetMembers.filter(m => {
                let assigned = false;
                const cars = tripData && tripData.cars ? tripData.cars : [];
                cars.forEach(car => {
                    if(car.passengers && car.passengers.includes(m.name)) assigned = true;
                });
                return !assigned;
            }).length;

            const totalCapacity = tripData && tripData.cars ? tripData.cars.reduce((sum, c) => sum + (c.isGear ? Math.max(0, c.capacity - 3) : c.capacity), 0) : 0;
            const balance = totalCapacity - totalTarget;

            const statTotal = document.getElementById('stat-total');
            const statAssigned = document.getElementById('stat-assigned');
            const statUnassigned = document.getElementById('stat-unassigned');
            const statSeats = document.getElementById('stat-seats');
            const balanceEl = document.getElementById('stat-balance');
            const balanceLabelEl = document.getElementById('stat-balance-label');

            if(statTotal) statTotal.textContent = totalTarget + '名';
            if(statAssigned) statAssigned.textContent = (totalTarget - unassignedCount) + '名';
            if(statUnassigned) statUnassigned.textContent = unassignedCount + '名';
            if(statSeats) statSeats.textContent = totalCapacity + '席';

            if(balanceEl && balanceLabelEl) {
                if(balance > 0) {
                    balanceEl.textContent = `余裕 +${balance}席`;
                    balanceEl.className = "text-lg sm:text-xl font-black text-emerald-300";
                    balanceLabelEl.textContent = "定員ステータス";
                } else if(balance === 0) {
                    balanceEl.textContent = "ちょうど 0席";
                    balanceEl.className = "text-lg sm:text-xl font-black text-blue-200";
                    balanceLabelEl.textContent = "定員ステータス";
                } else {
                    balanceEl.textContent = `不足 ${balance}席`;
                    balanceEl.className = "text-lg sm:text-xl font-black text-rose-400";
                    balanceLabelEl.textContent = "⚠️ 要車両追加";
                }
            }
        };

        window.selectSeatForQuickAssign = function(carId, seatIndex) {
            const team = window.appData.teams[window.appData.currentTeam];
            const tripData = getCurrentTripData();
            if(!team || !team.members) return;

            const unassignedMembers = team.members.filter(m => {
                if(m.attendance === 'absent' || m.attendance === 'self') return false;
                const isTarget = window.appData.currentTrip === 'to' ? (m.attendance === 'all' || m.attendance === 'am') : (m.attendance === 'all' || m.attendance === 'pm');
                if(!isTarget) return false;

                let assigned = false;
                if(tripData && tripData.cars) {
                    tripData.cars.forEach(car => {
                        if(car.passengers && car.passengers.includes(m.name)) assigned = true;
                    });
                }
                return !assigned;
            });

            if(unassignedMembers.length === 0) {
                alert('未割り当てのメンバーはいません。');
                return;
            }

            let msg = 'この席に乗せるメンバーを選んでください：\n\n';
            let list = unassignedMembers.map((m, i) => `${i + 1}: ${m.name} (${m.role === 'player' ? m.grade + '年' : m.role})`).join('\n');
            let input = prompt(msg + list + '\n\n番号を入力してください：');
            if(!input) return;

            let idx = parseInt(input) - 1;
            if(isNaN(idx) || idx < 0 || idx >= unassignedMembers.length) {
                alert('無効な番号です。');
                return;
            }

            window.assignMemberToSeat(carId, seatIndex, unassignedMembers[idx].name);
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if(window.render) window.render();
            }, 500);
        });
    </script>
</body>
</html>
