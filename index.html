<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塚戸Tレックス・配車調整システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-over { background-color: #eff6ff !important; border-color: #3b82f6 !important; transform: scale(1.02); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <div class="max-w-7xl mx-auto p-4 sm:p-6">
        <!-- ヘッダー -->
        <header class="bg-blue-900 text-white p-4 sm:p-6 rounded-2xl shadow-lg mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="relative group cursor-pointer w-16 h-16 bg-white/10 rounded-xl overflow-hidden flex items-center justify-center border-2 border-white/20 shadow-inner">
                    <img id="logo-img" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/..." alt="T-Rex Logo" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-xs font-bold text-center p-1">変更</div>
                    <input type="file" id="logo-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider flex items-center gap-2">
                        塚戸Tレックス <span class="text-blue-400 text-lg sm:text-xl font-medium">配車調整システム</span>
                    </h1>
                </div>
            </div>

            <!-- チームタブ -->
            <div class="flex bg-blue-950/80 p-1.5 rounded-xl border border-blue-800 gap-1" id="team-tabs">
                <button type="button" onclick="switchTeam('A')" class="team-tab px-4 py-2 rounded-lg text-sm font-bold transition bg-blue-600 text-white shadow" data-team="A">Aチーム</button>
                <button type="button" onclick="switchTeam('B')" class="team-tab px-4 py-2 rounded-lg text-sm font-bold transition text-blue-200 hover:text-white" data-team="B">Bチーム</button>
                <button type="button" onclick="switchTeam('C')" class="team-tab px-4 py-2 rounded-lg text-sm font-bold transition text-blue-200 hover:text-white" data-team="C">Cチーム</button>
                <button type="button" onclick="switchTeam('D')" class="team-tab px-4 py-2 rounded-lg text-sm font-bold transition text-blue-200 hover:text-white" data-team="D">Dチーム</button>
            </div>
        </header>

        <!-- 日程（スケジュール）切替・追加バー -->
        <div class="bg-white p-4 rounded-2xl shadow-md mb-6 border border-slate-200">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-3 pb-3 border-b border-slate-100">
                <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto py-1" id="schedule-tabs-container">
                    <!-- 動的挿入される日程タブ -->
                </div>
                <button type="button" onclick="openScheduleModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow flex items-center gap-1.5 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    新しい日程（試合日）を追加
                </button>
            </div>

            <!-- 現在選択中の日程の詳細設定 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">試合日:</label>
                    <input type="date" id="current-schedule-date" onchange="updateCurrentScheduleDate(this.value)" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex items-center gap-2 md:col-span-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">行き先・対戦相手:</label>
                    <input type="text" id="current-schedule-desc" oninput="updateCurrentScheduleDesc(this.value)" placeholder="例: 〇〇小学校 / vs 〇〇ファイターズ" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- 行き帰り切替 -->
            <div class="flex justify-center pt-3 mt-3 border-t border-slate-100">
                <div class="inline-flex bg-slate-100 p-1 rounded-xl shadow-inner">
                    <button type="button" onclick="switchTripType('to')" id="trip-to-btn" class="px-6 py-2 rounded-lg text-sm font-extrabold transition bg-blue-600 text-white shadow">行き（往路・午前）の配車</button>
                    <button type="button" onclick="switchTripType('from')" id="trip-from-btn" class="px-6 py-2 rounded-lg text-sm font-extrabold transition text-slate-600 hover:text-slate-900">帰り（復路・午後）の配車</button>
                </div>
            </div>
        </div>

        <!-- リアルタイム残席状況サマリーバー -->
        <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-4 rounded-2xl shadow-lg mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-6">
                <div>
                    <span id="stat-target-label" class="text-xs text-blue-300 block font-bold">対象乗車人数(往路)</span>
                    <span id="stat-total" class="text-2xl font-black">0名</span>
                </div>
                <div class="h-8 w-px bg-blue-700"></div>
                <div>
                    <span class="text-xs text-blue-300 block font-bold">乗車完了</span>
                    <span id="stat-assigned" class="text-2xl font-black text-emerald-400">0名</span>
                </div>
                <div class="h-8 w-px bg-blue-700"></div>
                <div>
                    <span class="text-xs text-blue-300 block font-bold">未割り当て</span>
                    <span id="stat-unassigned" class="text-2xl font-black text-amber-400">0名</span>
                </div>
            </div>
            <div class="flex items-center gap-4 bg-blue-950/60 px-4 py-2 rounded-xl border border-blue-800">
                <div>
                    <span class="text-xs text-blue-300 block font-bold">車両総定員 (実効)</span>
                    <span id="stat-seats" class="text-xl font-bold">0席</span>
                </div>
                <div class="h-8 w-px bg-blue-700"></div>
                <div>
                    <span id="stat-balance-label" class="text-xs font-bold block">過不足</span>
                    <span id="stat-balance" class="text-xl font-black">余裕 ±0</span>
                </div>
            </div>
        </div>

        <!-- メインコンテンツグリッド -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- メンバー管理サイドパネル -->
            <div class="lg:col-span-1 bg-white p-5 rounded-2xl shadow-md border border-slate-200 flex flex-col h-[700px]">
                <h2 class="text-lg font-black text-blue-900 mb-3 flex items-center justify-between">
                    <span>チームメンバー大元</span>
                    <span id="member-count-badge" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full">0名</span>
                </h2>
                
                <!-- メンバー追加フォーム -->
                <form onsubmit="addMember(event)" class="space-y-2 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div class="text-xs font-bold text-slate-600">新規メンバー登録</div>
                    <input type="text" id="new-member-name" required placeholder="氏名を入力..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="new-member-role" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-bold text-slate-700 outline-none">
                            <option value="player">選手</option>
                            <option value="parent">保護者</option>
                            <option value="staff">スタッフ</option>
                        </select>
                        <select id="new-member-attendance" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-bold text-slate-700 outline-none">
                            <option value="all">終日参加</option>
                            <option value="am">午前のみ</option>
                            <option value="pm">午後のみ</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded-lg text-xs transition shadow">メンバーを追加</button>
                </form>

                <!-- 未割り当てメンバー（ドラッグ可能） -->
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex justify-between items-center">
                    <span id="unassigned-title">未割り当て (往路)</span>
                    <span class="text-[10px] text-blue-500">ドラッグで座席へ</span>
                </div>
                <div id="unassigned-list" class="flex-1 overflow-y-auto space-y-2 pr-1 border border-dashed border-slate-200 rounded-xl p-3 bg-slate-50/50" ondragover="allowDrop(event)" ondragleave="removeDragOver(event)" ondrop="dropToUnassigned(event)">
                    <!-- 動的挿入 -->
                </div>
            </div>

            <!-- 車両・駐車場メインエリア -->
            <div class="lg:col-span-3 flex flex-col gap-6">
                <div class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-md border border-slate-200">
                    <h2 class="text-lg font-black text-blue-900 flex items-center gap-2">
                        <span>駐車場・車両一覧</span>
                        <span id="car-count-badge" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full">0台</span>
                    </h2>
                    <button type="button" onclick="openCarModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition shadow-md flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        新しい車を追加
                    </button>
                </div>

                <!-- 車両カード一覧 -->
                <div id="car-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 動的挿入 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 車両追加モーダル -->
    <div id="car-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all">
            <h3 class="text-xl font-black text-blue-900 mb-4">車両の追加</h3>
            <form onsubmit="handleCreateCar(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">持ち主名（ドライバー）</label>
                    <input type="text" id="car-owner" required placeholder="例: 鈴木パパ" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">最大乗車定員（運転手含む）</label>
                    <select id="car-capacity" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="4">4人乗り</option>
                        <option value="5" selected>5人乗り</option>
                        <option value="6">6人乗り</option>
                        <option value="7">7人乗り（ミニバン）</option>
                        <option value="8">8人乗り（ミニバン）</option>
                    </select>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <input type="checkbox" id="car-is-gear" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                    <div>
                        <label for="car-is-gear" class="text-sm font-bold text-slate-700 cursor-pointer">道具車にする</label>
                        <p class="text-xs text-slate-500">定員のうち3席分が自動で「道具」に割り当てられます</p>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeCarModal()" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">キャンセル</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition shadow">追加する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 新規日程追加モーダル -->
    <div id="schedule-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all">
            <h3 class="text-xl font-black text-blue-900 mb-4">新しい日程（試合日）の追加</h3>
            <form onsubmit="handleCreateSchedule(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">試合日</label>
                    <input type="date" id="new-sched-date" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">行先・大会名</label>
                    <input type="text" id="new-sched-desc" required placeholder="例: 〇〇小学校遠征" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeScheduleModal()" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">キャンセル</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold transition shadow">追加する</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // データモデル
        let appData = {
            currentTeam: 'A',
            currentTrip: 'to', // 'to': 行き, 'from': 帰り
            teams: {
                A: {
                    currentScheduleId: 'sched_1',
                    members: [
                        { name: '田中大輝', role: 'player', attendance: 'all' },
                        { name: '佐藤尚輝', role: 'player', attendance: 'all' },
                        { name: '鈴木美輝', role: 'player', attendance: 'am' },
                        { name: '高橋拓', role: 'player', attendance: 'pm' },
                        { name: '渡辺薫', role: 'staff', attendance: 'all' }
                    ],
                    schedules: [
                        {
                            id: 'sched_1',
                            date: '2026-06-12',
                            destination: '〇〇小学校遠征',
                            tripTo: { cars: [] },
                            tripFrom: { cars: [] }
                        }
                    ]
                },
                B: { currentScheduleId: 'sched_b1', members: [], schedules: [{ id: 'sched_b1', date: '2026-06-12', destination: '練習試合', tripTo: { cars: [] }, tripFrom: { cars: [] } }] },
                C: { currentScheduleId: 'sched_c1', members: [], schedules: [{ id: 'sched_c1', date: '2026-06-12', destination: '練習試合', tripTo: { cars: [] }, tripFrom: { cars: [] } }] },
                D: { currentScheduleId: 'sched_d1', members: [], schedules: [{ id: 'sched_d1', date: '2026-06-12', destination: '練習試合', tripTo: { cars: [] }, tripFrom: { cars: [] } }] }
            }
        };

        function switchTeam(teamKey) {
            appData.currentTeam = teamKey;
            document.querySelectorAll('.team-tab').forEach(btn => {
                if(btn.dataset.team === teamKey) {
                    btn.className = "team-tab px-4 py-2 rounded-lg text-sm font-bold transition bg-blue-600 text-white shadow";
                } else {
                    btn.className = "team-tab px-4 py-2 rounded-lg text-sm font-bold transition text-blue-200 hover:text-white";
                }
            });
            render();
        }

        function switchTripType(type) {
            appData.currentTrip = type;
            const toBtn = document.getElementById('trip-to-btn');
            const fromBtn = document.getElementById('trip-from-btn');
            if(type === 'to') {
                toBtn.className = "px-6 py-2 rounded-lg text-sm font-extrabold transition bg-blue-600 text-white shadow";
                fromBtn.className = "px-6 py-2 rounded-lg text-sm font-extrabold transition text-slate-600 hover:text-slate-900";
            } else {
                fromBtn.className = "px-6 py-2 rounded-lg text-sm font-extrabold transition bg-blue-600 text-white shadow";
                toBtn.className = "px-6 py-2 rounded-lg text-sm font-extrabold transition text-slate-600 hover:text-slate-900";
            }
            render();
        }

        function getCurrentSchedule() {
            const team = appData.teams[appData.currentTeam];
            if (!team.schedules || team.schedules.length === 0) {
                team.schedules = [{
                    id: 'sched_' + Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    destination: '試合',
                    tripTo: { cars: [] },
                    tripFrom: { cars: [] }
                }];
                team.currentScheduleId = team.schedules[0].id;
            }
            let sched = team.schedules.find(s => s.id === team.currentScheduleId);
            if(!sched) {
                team.currentScheduleId = team.schedules[0].id;
                sched = team.schedules[0];
            }
            return sched;
        }

        function switchSchedule(schedId) {
            appData.teams[appData.currentTeam].currentScheduleId = schedId;
            render();
        }

        function openScheduleModal() {
            const modal = document.getElementById('schedule-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('new-sched-date').value = new Date().toISOString().split('T')[0];
        }

        function closeScheduleModal() {
            const modal = document.getElementById('schedule-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handleCreateSchedule(event) {
            event.preventDefault();
            const dateInput = document.getElementById('new-sched-date').value;
            const descInput = document.getElementById('new-sched-desc').value.trim();
            if(!dateInput || !descInput) return;

            const team = appData.teams[appData.currentTeam];
            const newId = 'sched_' + Date.now();
            team.schedules.push({
                id: newId,
                date: dateInput,
                destination: descInput,
                tripTo: { cars: [] },
                tripFrom: { cars: [] }
            });
            team.currentScheduleId = newId;
            document.getElementById('new-sched-desc').value = '';
            closeScheduleModal();
            render();
        }

        function updateCurrentScheduleDate(val) {
            const sched = getCurrentSchedule();
            if(sched) {
                sched.date = val;
                renderScheduleTabs();
            }
        }

        function updateCurrentScheduleDesc(val) {
            const sched = getCurrentSchedule();
            if(sched) {
                sched.destination = val;
                renderScheduleTabs();
            }
        }

        // ロゴアップロード処理
        document.getElementById('logo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('logo-img').src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function getTargetMembers() {
            const team = appData.teams[appData.currentTeam];
            return team.members.filter(m => {
                if(m.role === 'parent') return false; 
                if(appData.currentTrip === 'to') {
                    return m.attendance === 'all' || m.attendance === 'am';
                } else {
                    return m.attendance === 'all' || m.attendance === 'pm';
                }
            });
        }

        function getCurrentTripData() {
            const sched = getCurrentSchedule();
            if(!sched) return { cars: [] };
            return appData.currentTrip === 'to' ? sched.tripTo : sched.tripFrom;
        }

        function addMember(event) {
            event.preventDefault();
            const input = document.getElementById('new-member-name');
            const roleSelect = document.getElementById('new-member-role');
            const attendanceSelect = document.getElementById('new-member-attendance');
            
            const name = input.value.trim();
            if(!name) return;
            
            const team = appData.teams[appData.currentTeam];
            if(team.members.some(m => m.name === name)) {
                alert('既に登録されている名前です');
                return;
            }

            team.members.push({ 
                name: name, 
                role: roleSelect.value, 
                attendance: attendanceSelect.value 
            });
            input.value = '';
            render();
        }

        function removeMember(name) {
            const team = appData.teams[appData.currentTeam];
            team.members = team.members.filter(m => m.name !== name);
            team.schedules.forEach(sched => {
                [sched.tripTo, sched.tripFrom].forEach(trip => {
                    trip.cars.forEach(car => {
                        car.passengers = car.passengers.map(p => p === name ? null : p);
                    });
                });
            });
            render();
        }

        function updateMemberProp(name, prop, val) {
            const team = appData.teams[appData.currentTeam];
            const member = team.members.find(m => m.name === name);
            if(member) {
                member[prop] = val;
                render();
            }
        }

        function openCarModal() {
            const modal = document.getElementById('car-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCarModal() {
            const modal = document.getElementById('car-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handleCreateCar(event) {
            event.preventDefault();
            const owner = document.getElementById('car-owner').value.trim();
            const capacity = parseInt(document.getElementById('car-capacity').value);
            const isGear = document.getElementById('car-is-gear').checked;

            if(!owner) return;

            const sched = getCurrentSchedule();
            if(!sched) return;

            const carId = 'car_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            
            sched.tripTo.cars.push({
                id: carId + '_to',
                owner: owner,
                capacity: capacity,
                isGear: isGear,
                passengers: new Array(capacity).fill(null)
            });

            sched.tripFrom.cars.push({
                id: carId + '_from',
                owner: owner,
                capacity: capacity,
                isGear: isGear,
                passengers: new Array(capacity).fill(null)
            });

            document.getElementById('car-owner').value = '';
            document.getElementById('car-is-gear').checked = false;
            closeCarModal();
            render();
        }

        function deleteCar(carId) {
            const tripData = getCurrentTripData();
            tripData.cars = tripData.cars.filter(c => c.id !== carId);
            render();
        }

        // ドラッグ＆ドロップ
        let draggedMember = null;

        function dragMember(e, name) {
            draggedMember = name;
            e.dataTransfer.setData('text/plain', name);
        }

        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function removeDragOver(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function dropToSeat(e, carId, seatIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const memberName = draggedMember || e.dataTransfer.getData('text/plain');
            if(!memberName) return;

            assignMemberToSeat(carId, seatIndex, memberName);
        }

        function dropToUnassigned(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const memberName = draggedMember || e.dataTransfer.getData('text/plain');
            if(!memberName) return;

            unassignMember(memberName);
        }

        function assignMemberToSeat(carId, seatIndex, memberName) {
            const tripData = getCurrentTripData();

            tripData.cars.forEach(c => {
                c.passengers = c.passengers.map(p => p === memberName ? null : p);
            });

            const car = tripData.cars.find(c => c.id === carId);
            if(car) {
                if(car.isGear && seatIndex < 3) return;
                car.passengers[seatIndex] = memberName;
            }
            draggedMember = null;
            render();
        }

        function unassignMember(memberName) {
            const tripData = getCurrentTripData();
            tripData.cars.forEach(c => {
                c.passengers = c.passengers.map(p => p === memberName ? null : p);
            });
            draggedMember = null;
            render();
        }

        function renderScheduleTabs() {
            const team = appData.teams[appData.currentTeam];
            const container = document.getElementById('schedule-tabs-container');
            if (!container) return;
            container.innerHTML = '';

            if (!team.schedules || team.schedules.length === 0) return;

            team.schedules.forEach(sched => {
                const isActive = sched.id === team.currentScheduleId;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => switchSchedule(sched.id);
                btn.className = `px-3.5 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap shadow-sm border ${isActive ? 'bg-blue-600 text-white border-blue-600 shadow' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`;
                btn.textContent = `${sched.date} (${sched.destination || '無題'})`;
                container.appendChild(btn);
            });
        }

        function render() {
            const team = appData.teams[appData.currentTeam];
            const sched = getCurrentSchedule();
            
            renderScheduleTabs();

            if(sched) {
                document.getElementById('current-schedule-date').value = sched.date;
                document.getElementById('current-schedule-desc').value = sched.destination;
            }

            const tripData = getCurrentTripData();
            const targetMembers = getTargetMembers();

            document.getElementById('member-count-badge').textContent = team.members.length + '名';
            document.getElementById('car-count-badge').textContent = tripData.cars.length + '台';
            document.getElementById('unassigned-title').textContent = appData.currentTrip === 'to' ? '未割り当て (往路・乗車対象)' : '未割り当て (復路・乗車対象)';
            document.getElementById('stat-target-label').textContent = appData.currentTrip === 'to' ? '乗車対象人数(往路)' : '乗車対象人数(復路)';

            // メンバー一覧リスト描画
            const unassignedContainer = document.getElementById('unassigned-list');
            unassignedContainer.innerHTML = '';

            if(team.members.length === 0) {
                unassignedContainer.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">メンバーが登録されていません</div>';
            } else {
                team.members.forEach(m => {
                    const isRider = m.role !== 'parent'; 
                    const isTarget = isRider && (
                        (appData.currentTrip === 'to' && (m.attendance === 'all' || m.attendance === 'am')) ||
                        (appData.currentTrip === 'from' && (m.attendance === 'all' || m.attendance === 'pm'))
                    );

                    let assignedCarOwner = null;
                    if(isRider) {
                        tripData.cars.forEach(car => {
                            if(car.passengers.includes(m.name)) assignedCarOwner = car.owner;
                        });
                    }

                    const el = document.createElement('div');
                    el.className = `border rounded-xl p-2.5 shadow-sm transition flex flex-col gap-1.5 ${isTarget ? 'bg-white border-slate-200 hover:border-blue-400' : 'bg-slate-100 opacity-70 border-slate-200'}`;
                    
                    if(isTarget && !assignedCarOwner) {
                        el.draggable = true;
                        el.ondragstart = (e) => dragMember(e, m.name);
                        el.classList.add('cursor-grab');
                    }

                    let roleBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded font-bold bg-blue-100 text-blue-800">選手</span>';
                    if(m.role === 'parent') roleBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">保護者</span>';
                    if(m.role === 'staff') roleBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded font-bold bg-indigo-100 text-indigo-800">スタッフ</span>';

                    let attBadgeColor = 'bg-slate-200 text-slate-700';
                    let attText = '終日';
                    if(m.attendance === 'am') { attBadgeColor = 'bg-amber-100 text-amber-800'; attText = '午前'; }
                    if(m.attendance === 'pm') { attBadgeColor = 'bg-purple-100 text-purple-800'; attText = '午後'; }

                    el.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold text-sm text-slate-800">${m.name}</span>
                                ${roleBadge}
                                <span class="text-[10px] px-1 py-0.5 rounded font-bold ${attBadgeColor}">${attText}</span>
                            </div>
                            <button type="button" onclick="removeMember('${m.name}')" class="text-slate-400 hover:text-red-500 text-xs px-1 py-0.5 rounded" title="削除">✕</button>
                        </div>
                        <div class="flex items-center justify-between text-[11px] pt-1 border-t border-slate-100">
                            <div class="flex gap-1">
                                <select onchange="updateMemberProp('${m.name}', 'role', this.value)" class="bg-slate-50 border border-slate-200 rounded px-1 py-0.5 text-[10px] text-slate-600 outline-none">
                                    <option value="player" ${m.role==='player'?'selected':''}>選手</option>
                                    <option value="parent" ${m.role==='parent'?'selected':''}>保護者</option>
                                    <option value="staff" ${m.role==='staff'?'selected':''}>スタッフ</option>
                                </select>
                                <select onchange="updateMemberProp('${m.name}', 'attendance', this.value)" class="bg-slate-50 border border-slate-200 rounded px-1 py-0.5 text-[10px] text-slate-600 outline-none">
                                    <option value="all" ${m.attendance==='all'?'selected':''}>終日</option>
                                    <option value="am" ${m.attendance==='am'?'selected':''}>午前</option>
                                    <option value="pm" ${m.attendance==='pm'?'selected':''}>午後</option>
                                </select>
                            </div>
                            <span>${!isRider ? '<span class="text-slate-400 font-bold">配車対象外</span>' : (assignedCarOwner ? `<span class="text-emerald-600 font-bold">🚗 ${assignedCarOwner}車</span>` : (isTarget ? '<span class="text-amber-500 font-bold">未割当</span>' : '<span class="text-slate-400">対象外</span>'))}</span>
                        </div>
                    `;
                    unassignedContainer.appendChild(el);
                });
            }

            // 車両一覧描画
            const carGrid = document.getElementById('car-grid');
            carGrid.innerHTML = '';

            let totalCapacity = 0;
            let totalAssigned = 0;

            tripData.cars.forEach(car => {
                const effectiveCapacity = car.isGear ? Math.max(0, car.capacity - 3) : car.capacity;
                totalCapacity += effectiveCapacity;

                const assignedCount = car.passengers.filter((p, idx) => {
                    if(car.isGear && idx < 3) return false;
                    return p !== null;
                }).length;
                totalAssigned += assignedCount;

                const carCard = document.createElement('div');
                carCard.className = "bg-white border border-slate-200 rounded-2xl p-5 shadow-md flex flex-col justify-between";
                
                let seatsHtml = '';
                for(let i = 0; i < car.capacity; i++) {
                    const isGearSeat = car.isGear && i < 3;
                    const occupant = car.passengers[i];

                    if(isGearSeat) {
                        seatsHtml += `
                            <div class="h-14 rounded-xl bg-amber-100 border-2 border-dashed border-amber-300 flex flex-col items-center justify-center text-amber-800 font-bold text-xs select-none shadow-inner">
                                <span>🎒</span>
                                <span class="text-[10px]">道具</span>
                            </div>
                        `;
                    } else if(occupant) {
                        seatsHtml += `
                            <div draggable="true" ondragstart="dragMember(event, '${occupant}')" 
                                 ondragover="allowDrop(event)" ondragleave="removeDragOver(event)" ondrop="dropToSeat(event, '${car.id}', ${i})"
                                 class="h-14 rounded-xl bg-blue-50 border-2 border-blue-400 flex flex-col items-center justify-center text-blue-900 font-bold text-xs cursor-grab hover:bg-blue-100 transition shadow-sm relative group">
                                <span class="text-[10px] text-blue-500">席 ${i+1}</span>
                                <span class="truncate px-1 max-w-full">${occupant}</span>
                                <button type="button" onclick="unassignMember('${occupant}')" class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center">×</button>
                            </div>
                        `;
                    } else {
                        seatsHtml += `
                            <div ondragover="allowDrop(event)" ondragleave="removeDragOver(event)" ondrop="dropToSeat(event, '${car.id}', ${i})"
                                 class="h-14 rounded-xl bg-slate-50 border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 text-xs hover:border-blue-400 hover:bg-blue-50/30 transition">
                                <span class="text-[10px]">席 ${i+1}</span>
                                <span class="text-[10px]">空席</span>
                            </div>
                        `;
                    }
                }

                carCard.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-xl">🚗</span>
                                <div>
                                    <h3 class="font-extrabold text-blue-900">${car.owner}の車</h3>
                                    <p class="text-xs text-slate-500">定員: ${car.capacity}名 ${car.isGear ? '<span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold ml-1">道具車</span>' : ''}</p>
                                </div>
                            </div>
                            <button type="button" onclick="deleteCar('${car.id}')" class="text-slate-400 hover:text-red-500 text-xs p-1.5 rounded-lg hover:bg-red-50 transition">削除</button>
                        </div>
                        <div class="grid grid-cols-4 gap-2 mb-4">
                            ${seatsHtml}
                        </div>
                    </div>
                    <div class="text-right text-xs font-bold text-slate-500 border-t border-slate-100 pt-2">
                        乗車人数: <span class="text-blue-600 font-black">${assignedCount}</span> / ${effectiveCapacity} 名
                    </div>
                `;
                carGrid.appendChild(carCard);
            });

            if(tripData.cars.length === 0) {
                carGrid.innerHTML = `
                    <div class="col-span-2 py-12 text-center bg-white border border-dashed border-slate-300 rounded-2xl">
                        <p class="text-slate-400 text-sm font-bold">登録されている車がありません。「新しい車を追加」ボタンから登録してください。</p>
                    </div>
                `;
            }

            // サマリー計算
            const totalTarget = targetMembers.length;
            const unassignedCount = targetMembers.filter(m => {
                let assigned = false;
                tripData.cars.forEach(car => {
                    if(car.passengers.includes(m.name)) assigned = true;
                });
                return !assigned;
            }).length;

            const balance = totalCapacity - totalTarget;

            document.getElementById('stat-total').textContent = totalTarget + '名';
            document.getElementById('stat-assigned').textContent = (totalTarget - unassignedCount) + '名';
            document.getElementById('stat-unassigned').textContent = unassignedCount + '名';
            document.getElementById('stat-seats').textContent = totalCapacity + '席';

            const balanceEl = document.getElementById('stat-balance');
            const balanceLabelEl = document.getElementById('stat-balance-label');
            if(balance > 0) {
                balanceEl.textContent = `余裕 +${balance}席`;
                balanceEl.className = "text-xl font-black text-emerald-300";
                balanceLabelEl.textContent = "定ータス";
            } else if(balance === 0) {
                balanceEl.textContent = "ちょうどピッタシ 0席";
                balanceEl.className = "text-xl font-black text-blue-200";
                balanceLabelEl.textContent = "定員ステータス";
            } else {
                balanceEl.textContent = `座席不足 ${balance}席`;
                balanceEl.className = "text-xl font-black text-rose-400";
                balanceLabelEl.textContent = "⚠️ 要車両追加";
            }
        }

        // 初期描画
        render();
    </script>
</body>
</html>
